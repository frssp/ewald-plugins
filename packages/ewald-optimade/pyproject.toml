[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ewald-optimade"
version = "0.2.0"
description = "Moved into EWALD (ewald.optimade, built in since 2026-10-28); this package only re-exports it"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ewald>=0.2"]

[project.optional-dependencies]
test = ["pytest"]


[tool.setuptools.packages.find]
where = ["src"]
