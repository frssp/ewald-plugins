[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ewald-phonopy"
version = "0.3.0"
description = "Phonon bands in EWALD from phonopy force constants (phonopy.yaml + FORCE_SETS) and phonopy.Phonopy objects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ewald>=0.1", "phonopy>=2.20", "seekpath"]

[project.entry-points."ewald.plugins"]
phonopy = "ewald_phonopy"

[project.entry-points."ewald.readers"]
phonopy-fc = "ewald_phonopy.reader:PhonopyForceConstantsReader"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ewald_phonopy = ["ewald-plugin.toml", "examples/*"]
