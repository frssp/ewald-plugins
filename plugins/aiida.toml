id = "aiida"
name = "AiiDA results"
summary = "Open AiiDA nodes by PK or UUID: load(\"aiida:1234\") for structures, trajectories, bands, workflows and aiida-phonopy results"
kinds = ["reader"]
source = "pip:git+https://github.com/frssp/ewald-plugins@241f2799c2f56d0fc5e121b7ca963e249a5f4ec2#subdirectory=packages/ewald-aiida"
version = "0.2.0"
requires_ewald = ">=0.1"
author = "frssp"
homepage = "https://github.com/frssp/ewald-plugins/tree/main/packages/ewald-aiida"
description = "Reads the AiiDA profile you use with verdi (local SQLite or PostgreSQL; no daemon or RabbitMQ), or one on another machine over SSH (aiida://user@host/1234; nothing installed there). A WorkChain or WorkGraph PK opens its trajectory (restarts joined), phonons, bands or structures; aiida-phonopy results become phonon modes through ewald-phonopy (pip install 'ewald-aiida[phonopy]'). python -m ewald_aiida tree/find browses the provenance graph. An AiiDA archive (.aiida) opens read-only without a database server (ewald_aiida.open_archive), and each step says what it computed (step.shape: relax/static/bands/dos/md/phonon with slab, potential, cell_relax, charged flags, from its inputs). Read-only. Phonons need ewald-phonopy >= 0.2.1. Needs an EWALD with reader schemes (after 2026-10-19)."
