id = "simagent"
name = "sim-agent results"
summary = "Open your finished sim-agent calculations by AiiDA PK: load(\"simagent:1234\") for trajectories, structures and VASP files"
kinds = ["reader", "settings_page", "panel", "workflow_source"]
source = "pip:git+https://github.com/frssp/ewald-simagent@9631230b90d154dd03cfc194c940559bf8aa3262"
version = "0.2.4"
requires_ewald = ">=0.1"
author = "frssp"
homepage = "https://github.com/frssp/ewald-simagent"
description = "Reads a sim-agent server's results API v1 with an access key made in its web UI (the key is kept in the OS keychain). A workflow opens as steps with their trajectories, structures and retrieved files; CHGCAR/LOCPOT and other files left on the cluster are read over SSH. Adds a sim-agent side bar (each calculation with the name of the chat that submitted it), the workflow AI tools and a Diagnose button (also `python -m ewald_simagent doctor`) that checks the connection step by step; a band-offset workflow opens with its potential lineup (VBM, CBM, E_F, Schottky barrier) and a work-function workflow with the work function of every slab, as notebook cells. Read-only: submitting stays in sim-agent. Needs a sim-agent with the results API and an EWALD with workflow sources (after 2026-10-20)."
