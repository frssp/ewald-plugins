description = "Reads a sim-agent server's results API v1 with an access key made in its web UI (the key is kept in the OS keychain). A workflow opens as steps with their trajectories, structures and retrieved files; CHGCAR/LOCPOT and other files left on the cluster are read over SSH. Adds a sim-agent side bar and the workflow AI tools; a band-offset workflow opens with its potential lineup (VBM, CBM, E_F, Schottky barrier) as notebook cells. Read-only: submitting stays in sim-agent. Needs a sim-agent with the results API and an EWALD with workflow sources (after 2026-10-20)."
