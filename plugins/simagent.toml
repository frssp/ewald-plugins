id = "simagent"
name = "sim-agent results"
summary = "Open your finished sim-agent calculations by AiiDA PK: load(\"simagent:1234\") for trajectories, structures and VASP files"
kinds = ["reader", "settings_page", "panel", "workflow_source"]
source = "pip:git+https://github.com/frssp/ewald-simagent@0d3327c7161e4f3b3c6f74219eb9f217683c1c81"
version = "0.1.0"
requires_ewald = ">=0.1"
author = "frssp"
homepage = "https://github.com/frssp/ewald-simagent"
description = "Reads a sim-agent server's results API v1 with an access key made in its web UI (the key is kept in the OS keychain). A workflow opens as steps with their trajectories, structures and retrieved files; CHGCAR/LOCPOT and other files left on the cluster are read over SSH. Adds a sim-agent side bar and the workflow AI tools. Read-only: submitting stays in sim-agent. Needs a sim-agent with the results API and an EWALD with workflow sources (after 2026-10-20)."
