id = "optimade"
name = "OPTIMADE structures"
summary = "Search and open structures of Materials Project, COD, OQMD, Alexandria, NOMAD, Materials Cloud and other OPTIMADE databases: load(\"optimade:mp/mp-149\")"
kinds = ["reader", "tool", "panel", "settings_page"]
source = "pip:git+https://github.com/frssp/ewald-plugins@bf090ab7c0e71fe00fe97bf4e094968b29de84bd#subdirectory=packages/ewald-optimade"
version = "0.1.0"
requires_ewald = ">=0.1"
author = "frssp"
homepage = "https://github.com/frssp/ewald-plugins/tree/main/packages/ewald-optimade"
description = "No account or API key. load(\"optimade:DB/ID\") opens one structure, load(\"optimade:DB?QUERY\") every structure a query finds (one frame each); a query is a formula (LiFePO4), a chemical system (Li-P-S), elements (Li P S) or an OPTIMADE filter. search() lists hits; the OPTIMADE side bar searches and opens; the AI gets a read-only optimade_search tool. More databases under Preferences > OPTIMADE."
