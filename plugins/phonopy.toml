id = "phonopy"
name = "phonopy force constants"
summary = "Phonon bands phonopy computes from phonopy.yaml with FORCE_SETS or force constants, and from phonopy.Phonopy objects"
kinds = ["reader"]
source = "pip:git+https://github.com/frssp/ewald-plugins@a49b9fab88124ce1e70dc162331c171ecc1cbaf7#subdirectory=packages/ewald-phonopy"
version = "0.3.0"
requires_ewald = ">=0.1"
author = "frssp"
homepage = "https://github.com/frssp/ewald-plugins/tree/main/packages/ewald-phonopy"
description = "phonopy loads phonopy.yaml, phonopy_params.yaml or phonopy_disp.yaml with FORCE_SETS or FORCE_CONSTANTS and computes the band structure with eigenvectors along the seekpath path; from_phonopy turns a phonopy.Phonopy object (from aiida-phonopy, say) into a pipeline. Installs phonopy and seekpath. band.yaml, VASP IBRION=5-8 OUTCARs and the PhononMode animation are built into EWALD since 2026-10-23, and version 0.3 needs such an EWALD (use 0.2.2 with an older one)."
